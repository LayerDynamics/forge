name: Docs Sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  docs-check:
    name: Documentation drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      # Informational: print the full current drift report (never fails the job).
      # forge-docs-check is pure-Rust file analysis — no webkit/gtk deps needed.
      - name: Full drift report
        run: cargo run -p forge-docs-check || true

      # Enforcement: the baseline-aware gate. Passes when drift matches the
      # recorded baseline; fails on NEW drift (or on baselined drift that was
      # fixed without removing it from tests/known_drift_baseline.txt).
      - name: Drift gate (baseline-aware)
        run: cargo test -p forge-docs-check --test docs_sync

name: Cross-Platform Verify

# Builds, lints, and tests the workspace on all three target OSes so that
# platform-specific code (#[cfg(target_os = "...")] / #[cfg(windows)] branches —
# e.g. the WebKit / WebView2 / WebKitGTK DevTools paths) is actually compiled,
# clippy-checked, AND tested on the OS it targets. The default `ci.yml` only
# runs clippy on Ubuntu, so macOS/Windows-only code is never linted there.
#
# Runs on every branch push (so feature branches get verified before merge) and
# can be triggered on demand from the Actions tab or `gh workflow run`.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The workspace target/ + cargo cache for this large dependency graph
      # (deno_core, swc, v8, etc.) can exceed the ubuntu runner's ~14GB of free
      # space, causing intermittent "No space left on device" failures. Reclaim
      # ~25GB of preinstalled tooling we don't use before building.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-xplat-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-xplat-

      # Debug profile keeps debug_assertions on, which compiles the
      # `#[cfg(any(debug_assertions, feature = "devtools"))]` DevTools paths.
      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      # Clippy is reported but non-blocking: the workspace currently carries
      # pre-existing macOS lint debt (ext_dock uses the deprecated `cocoa`
      # crate; a `cocoa` -> `objc2` migration is tracked separately). Build and
      # test are the hard cross-platform gates; clippy surfaces issues without
      # blocking compile/test verification. Flip `continue-on-error` to false
      # once the workspace is clippy-clean on all OSes.
      - name: Clippy (workspace, all targets, deny warnings)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

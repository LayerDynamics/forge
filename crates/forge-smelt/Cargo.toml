[package]
name = "forge-smelt"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Forge Smelt - ahead-of-time TypeScript to JavaScript compiler for Forge apps"
license = "MIT"
build = "build.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--document-private-items"]

[dependencies]
# Shared TypeScript transpile (TS -> JS) used by the rest of the workspace.
forge-weld = { path = "../forge-weld" }
# Module parsing + dependency analysis. Pinned to the same version forge-weld
# uses so the two share a single deno_ast in the tree.
deno_ast = { version = "0.52", features = ["transpiling"] }

serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"

[build-dependencies]
# The package build script transpiles the embedded bootstrap shim
# (ts/init.ts -> init.js) using the shared transpile path.
forge-weld = { path = "../forge-weld" }

[dev-dependencies]
tempfile = "3"
# The end-to-end test loads + executes the compiled output in the same JS engine
# the runtime uses, proving the rewritten relative imports resolve and run.
deno_core = "0.373"
tokio = { version = "1", features = ["rt", "macros"] }

[package]
name = "ext_dock"
version = "0.1.0-alpha.1"
edition = "2021"
description = "Forge Dock extension - macOS dock customization (icon, badge, bounce, menu)"
license = "MIT"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--document-private-items"]
[lib]
name = "ext_dock"

[dependencies]
deno_core = "0.373"
deno_error = "0.7"
forge-weld = { path = "../forge-weld" }
forge-weld-macro = { path = "../forge-weld-macro" }
linkme = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
image = "0.25"
tokio = { version = "1", features = ["sync"] }

# macOS-specific dependencies (objc2 stack; cocoa/objc are deprecated)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSData",
    "NSThread",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSResponder",
    "NSRunningApplication",
    "NSDockTile",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSCell",
] }
core-graphics = "0.24"

[build-dependencies]
forge-weld = { path = "../forge-weld" }
